name: CI

on:
  push:
    # main is verified by the deploy workflow before it publishes.
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Push and pull_request runs of the same branch share a group, so one cancels the other.
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/verify
