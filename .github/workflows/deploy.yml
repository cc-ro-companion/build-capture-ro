name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Only files that shape the published dist/ trigger a deploy. Tests, the data
    # pipeline and lint config are verified by CI on branches; generated data
    # lands in src/ and is covered there.
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - 'vite.config.ts'
      - 'svelte.config.js'
      - 'tsconfig.json'
      - '.github/workflows/deploy.yml'
      - '.github/actions/verify/**'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running deployment is not cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/verify
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # A manual run can be started on any branch; only main may reach the live site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
