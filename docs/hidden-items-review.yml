# Equipment that no monster drops in rAthena pre-renewal, for review.
#
# Set `hide: true` on every item that cannot be obtained on ccRO. Hidden items
# stay in the data (old builds keep working) but are not offered in search
# unless the user ticks "show hidden items". Leave everything else as it is.
# A `reason` is optional but helps later reviews (e.g. "event 2009", "cash shop").
#
# Generated from rAthena 7f080871c8b3bbe7a79027194633201c63422ee1 (db/pre-re, npc/ without re, custom, test)
# and the planner's items.json (data a1000f15): 1762 equipment items,
# 511 dropped by monsters, 1251 listed here.
#
# `from` lists the other rAthena sources: shop (NPC shop), craft (produce_db),
# npc reward (getitem in an NPC script), barter, box:<group> (item_group_db),
# socket:<id> (socket enchant NPC adds slots to item <id>; only useful if that
# base item is obtainable).
# `npc mention` / `npc id?` only mean the name or id appears in some NPC script
# (quest lists, dialogue, or a coincidental number); they are weak hints.
# rAthena NPCs are not ccRO NPCs, so a source here does not prove the item
# exists on ccRO, and a missing one does not prove it does not.

